<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Consulta - Archivos 2020 (PDF)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { color: #1a202c; font-weight: 600; margin-bottom: 5px; }
        .subtitle { color: #718096; font-size: 14px; margin-bottom: 20px; }

        /* Explorador */
        .explorer { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .toolbar { padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 15px; }
        .btn { padding: 8px 16px; cursor: pointer; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: 500; font-size: 14px; transition: background 0.2s; text-decoration: none; display: inline-block; }
        .btn:hover { background: #2b6cb0; }
        .btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        .btn-red { background: #e53e3e; }
        .btn-red:hover { background: #c53030; }
        .breadcrumbs { font-weight: 600; color: #4a5568; font-size: 15px; }

        /* Cuadrícula */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; padding: 25px; min-height: 150px; }
        .item { text-align: center; cursor: pointer; padding: 15px 10px; border-radius: 8px; border: 1px solid transparent; transition: all 0.2s; }
        .item:hover { background: #f7fafc; border-color: #e2e8f0; transform: translateY(-2px); }
        .icon { font-size: 44px; display: block; margin-bottom: 8px; user-select: none; }
        .name { font-size: 13px; font-weight: 500; color: #2d3748; word-break: break-word; line-height: 1.3; }

        /* Visor de PDF */
        .viewer { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 25px; display: none; border: 1px solid #e2e8f0; border-top: 4px solid #3182ce; }
        .viewer-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid #edf2f7; }
        .viewer-title-area { display: flex; align-items: center; gap: 10px; }
        .viewer-actions { display: flex; gap: 8px; }
        .viewer-badge { background: #ebf8ff; color: #2b6cb0; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; border: 1px solid #bee3f8; }
        .pdf-container { width: 100%; height: 600px; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; background: #eaeaea; }
        iframe { width: 100%; height: 100%; border: none; }
        .viewer-note { font-size: 12px; color: #718096; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Archivo Histórico Virtual</h2>
        <div class="subtitle">Módulo de Consulta Exclusiva de Documentos PDF (Modo Lectura)</div>

        <div class="explorer">
            <div class="toolbar">
                <button id="backBtn" class="btn" disabled>⬅ Volver</button>
                <div id="breadcrumbs" class="breadcrumbs">2020</div>
            </div>
            <div id="fileGrid" class="grid"></div>
        </div>

        <div id="fileViewer" class="viewer">
            <div class="viewer-header">
                <div class="viewer-title-area">
                    <h3 id="viewerTitle" style="margin: 0; color: #2d3748;">Documento PDF</h3>
                    <span class="viewer-badge">Solo Lectura</span>
                </div>
                <div class="viewer-actions">
                    <a id="openTabBtn" class="btn" href="#" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
                    <button id="closeViewerBtn" class="btn btn-red">Cerrar Vista</button>
                </div>
            </div>
            <div class="pdf-container">
                <iframe id="pdfViewer" src="about:blank" title="Visor de documento PDF"></iframe>
            </div>
            <div class="viewer-note">Si el documento no se muestra (por ejemplo, en celular), usa "Abrir en pestaña nueva".</div>
        </div>
    </div>

    <script>
        // =====================================================================
        // CONFIGURACIÓN: dirección de tu sitio de GitHub Pages donde están los PDF.
        // Formato: https://USUARIO.github.io/REPOSITORIO/
        // Ejemplo: https://odapas-neza.github.io/transparencia/
        // (Debe terminar en "/")
        // =====================================================================
        const BASE_URL = "https://USUARIO.github.io/REPOSITORIO/";

        // Cada "path" es la ruta del PDF DENTRO del repositorio,
        // respetando mayúsculas/minúsculas y la extensión .pdf
        const fileSystem = {
            name: "2020",
            type: "folder",
            children: [
                {
                    name: "1er Trimestre",
                    type: "folder",
                    children: [
                        { name: "XXXVB2020-01", type: "file", path: "2020/XXXVB2020-01.pdf" }
                    ]
                },
                {
                    name: "2do Trimestre",
                    type: "folder",
                    children: [
                        { name: "XXXVB2020-02", type: "file", path: "2020/XXXVB2020-02.pdf" }
                    ]
                },
                {
                    name: "3er Trimestre",
                    type: "folder",
                    children: [
                        { name: "XXXVB2020-03", type: "file", path: "2020/XXXVB2020-03.pdf" }
                    ]
                },
                {
                    name: "4to Trimestre",
                    type: "folder",
                    children: [
                        { name: "XXXVB2020-04", type: "file", path: "2020/XXXVB2020-04.pdf" }
                    ]
                }
            ]
        };

        // Arma la URL completa del PDF (acepta también una URL absoluta en "url")
        function buildPdfUrl(file) {
            if (file.url) return file.url;
            return new URL(encodeURI(file.path), BASE_URL).href;
        }

        let navigationHistory = [fileSystem];

        const fileGrid = document.getElementById('fileGrid');
        const backBtn = document.getElementById('backBtn');
        const breadcrumbs = document.getElementById('breadcrumbs');
        const fileViewer = document.getElementById('fileViewer');
        const viewerTitle = document.getElementById('viewerTitle');
        const pdfViewer = document.getElementById('pdfViewer');
        const closeViewerBtn = document.getElementById('closeViewerBtn');
        const openTabBtn = document.getElementById('openTabBtn');

        function render() {
            const currentFolder = navigationHistory[navigationHistory.length - 1];
            fileGrid.innerHTML = '';
            breadcrumbs.textContent = navigationHistory.map(f => f.name).join(' / ');
            backBtn.disabled = navigationHistory.length === 1;

            if (!currentFolder.children || currentFolder.children.length === 0) {
                fileGrid.innerHTML = '<p style="color: #a0aec0; grid-column: 1/-1; text-align: center; font-size: 14px; padding: 20px;">Esta carpeta no contiene documentos archivados.</p>';
                return;
            }

            currentFolder.children.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                const icon = item.type === 'folder' ? '📁' : '📕';
                itemDiv.innerHTML = `<span class="icon">${icon}</span><span class="name"></span>`;
                itemDiv.querySelector('.name').textContent = item.name;

                itemDiv.onclick = () => {
                    if (item.type === 'folder') {
                        navigationHistory.push(item);
                        render();
                    } else {
                        openPDF(item);
                    }
                };
                fileGrid.appendChild(itemDiv);
            });
        }

        function openPDF(file) {
            const pdfUrl = buildPdfUrl(file);
            viewerTitle.textContent = file.name;
            openTabBtn.href = pdfUrl;
            // Oculta barras nativas del lector (Chrome/Edge)
            pdfViewer.src = pdfUrl + "#toolbar=0&navpanes=0";
            fileViewer.style.display = "block";
            fileViewer.scrollIntoView({ behavior: 'smooth' });
        }

        closeViewerBtn.onclick = () => {
            fileViewer.style.display = "none";
            pdfViewer.src = "about:blank";
        };

        backBtn.onclick = () => {
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                render();
            }
        };

        render();
    </script>
</body>
</html>
